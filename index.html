<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- displays site properly based on user's device -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <meta
      name="description"
      content="Profile card that show user info and skills"
    />

    <!-- css styling file -->
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="main.css" />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        text-align: center;
        color: var(--White);
        font-size: 0.5rem;
        position: fixed;
        bottom: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
      }

      .attribution a {
        color: var(--Green);
      }
    </style>
  </head>
  <body>
    <main class="profile-card">
      <img
        class="profile-card-avatar"
        src="assets/images/avatar-jessica.jpeg"
        alt="jessica"
      />
      <h1 class="profile-name">Jessica Randall</h1>
      <p class="profile-meta">London, United Kingdom</p>
      <p class="profile-bio">"Front-end developer and avid reader."</p>
      <ul class="profile-skills">
        <li><a class="skill" href="#">GitHub</a></li>
        <li><a class="skill" href="#">Frontend Mentor</a></li>
        <li><a class="skill" href="#">LinkedIn</a></li>
        <li><a class="skill" href="#">Twitter</a></li>
        <li><a class="skill" href="#">Instagram</a></li>
      </ul>
    </main>

    <footer class="attribution">
      Challenge by:
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by:
      <a href="https://www.frontendmentor.io/home">MuhammedArrujbani</a>.
    </footer>
  </body>
</html>
